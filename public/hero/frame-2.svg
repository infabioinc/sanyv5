<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="BUILT FOR INDIAN ROADS">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E1141B" stop-opacity="0"/>
      <stop offset="1" stop-color="#E1141B" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect x="0" y="540" width="1600" height="360" fill="#101010"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <line x1="0" y1="540" x2="1600" y2="540" stroke="#E1141B" stroke-width="2" opacity="0.55"/>
  <!-- lane markers in perspective -->
  <g stroke="#242424" stroke-width="3">
    <line x1="790" y1="554" x2="810" y2="554"/>
    <line x1="782" y1="614" x2="818" y2="614"/>
    <line x1="774" y1="674" x2="826" y2="674"/>
    <line x1="766" y1="734" x2="834" y2="734"/>
    <line x1="758" y1="794" x2="842" y2="794"/>
    <line x1="750" y1="854" x2="850" y2="854"/>
  </g>
  <!-- heavy-duty tractor silhouette -->
  <g transform="translate(800, 540) scale(1.000)">
    <g transform="translate(-360,-250)">
      <rect x="120" y="60" width="230" height="200" rx="14" fill="#f4f4f4"/>
      <rect x="150" y="90" width="150" height="70" rx="8" fill="#8fbfe0" opacity="0.6"/>
      <rect x="350" y="20" width="360" height="240" rx="10" fill="#e6e6e6"/>
      <rect x="118" y="252" width="600" height="26" fill="#0d0d0d"/>
      <circle cx="215" cy="285" r="40" fill="#0d0d0d"/><circle cx="215" cy="285" r="16" fill="#E1141B"/>
      <circle cx="470" cy="285" r="40" fill="#0d0d0d"/><circle cx="470" cy="285" r="16" fill="#3a3a3a"/>
      <circle cx="560" cy="285" r="40" fill="#0d0d0d"/><circle cx="560" cy="285" r="16" fill="#3a3a3a"/>
      <rect x="120" y="150" width="10" height="34" fill="#E1141B"/>
    </g>
  </g>
  <text x="1582" y="884" text-anchor="end" font-family="Manrope, sans-serif" font-size="13" fill="#5a5a5a" letter-spacing="1">BUILT FOR INDIAN ROADS</text>
</svg>
