<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="DAILY ECONOMICS">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E1141B" stop-opacity="0"/>
      <stop offset="1" stop-color="#E1141B" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#sky)"/>
  <rect x="0" y="420" width="1200" height="280" fill="#101010"/>
  <rect width="1200" height="700" fill="url(#glow)"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#E1141B" stroke-width="2" opacity="0.55"/>
  <!-- lane markers in perspective -->
  <g stroke="#242424" stroke-width="3">
    <line x1="590" y1="434" x2="610" y2="434"/>
    <line x1="582" y1="480.6666666666667" x2="618" y2="480.6666666666667"/>
    <line x1="574" y1="527.3333333333334" x2="626" y2="527.3333333333334"/>
    <line x1="566" y1="574" x2="634" y2="574"/>
    <line x1="558" y1="620.6666666666666" x2="642" y2="620.6666666666666"/>
    <line x1="550" y1="667.3333333333333" x2="650" y2="667.3333333333333"/>
  </g>
  <!-- heavy-duty tractor silhouette -->
  <g transform="translate(600, 420) scale(0.750)">
    <g transform="translate(-360,-250)">
      <rect x="120" y="60" width="230" height="200" rx="14" fill="#f4f4f4"/>
      <rect x="150" y="90" width="150" height="70" rx="8" fill="#3a3a3a" opacity="0.6"/>
      <rect x="350" y="20" width="360" height="240" rx="10" fill="#e6e6e6"/>
      <rect x="118" y="252" width="600" height="26" fill="#0d0d0d"/>
      <circle cx="215" cy="285" r="40" fill="#0d0d0d"/><circle cx="215" cy="285" r="16" fill="#E1141B"/>
      <circle cx="470" cy="285" r="40" fill="#0d0d0d"/><circle cx="470" cy="285" r="16" fill="#3a3a3a"/>
      <circle cx="560" cy="285" r="40" fill="#0d0d0d"/><circle cx="560" cy="285" r="16" fill="#3a3a3a"/>
      <rect x="120" y="150" width="10" height="34" fill="#E1141B"/>
    </g>
  </g>
  <text x="1182" y="684" text-anchor="end" font-family="Manrope, sans-serif" font-size="13" fill="#5a5a5a" letter-spacing="1">DAILY ECONOMICS</text>
</svg>
